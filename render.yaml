services:
  - type: web
    name: blinkit-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python blinkit-bot.py
    envVars:
      - key: BLINKIT_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
